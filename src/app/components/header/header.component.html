<header class="bg-gray-100">
  <div class="mx-auto max-w-7xl px-2 sm:px-4 lg:divide-y lg:divide-teal-700 lg:px-8">
    <nav class="hidden lg:flex lg:space-x-1 lg:py-2 lg:justify-end" aria-label="Global">

      <div class="flex gap-1">
        <button (click)="onCreateCarpeta()"
          class=" hover:bg-gray-50  inline-flex items-center rounded-md py-2 px-3 text-sm font-medium cursor-pointer">
          <i class="fa-solid fa-folder-plus" style="color: #d68e1e;"></i>
        </button>

        <button (click)="onModificarCarpeta()"
          class=" hover:bg-gray-50 inline-flex items-center rounded-md py-2 px-3 text-sm font-medium cursor-pointer"><i
            class="fa-solid fa-pen-to-square" style="color: #d68e1e;"></i>
        </button>

        <button (click)="onCrearReporte() "
          class=" hover:bg-gray-50  inline-flex items-center rounded-md py-2 px-3 text-sm font-medium cursor-pointer">
          <i class="fa-solid fa-file-circle-plus" style="color: #d68e1e;"></i>
        </button>

        <button (click)="onModificarReporte()"
          class=" hover:bg-gray-50  inline-flex items-center rounded-md py-2 px-3 cursor-pointer text-sm font-medium">
          <i class="fa-solid fa-file-lines" style="color: #d68e1e;"></i>
        </button>


      </div>
    </nav>
  </div>
</header>
