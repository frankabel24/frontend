<header
  class="sticky top-0 z-30 flex h-[60px] items-center gap-4 border-b border-b-[#cd870a] bg-white px-4 md:px-6 w-full">
  <div class="w-full flex items-center">
    <!-- Si tienes un logo o título a la izquierda, lo puedes colocar aquí.
         Por ejemplo: <img src="/assets/logo.png" alt="Logo" class="h-8 w-auto mr-4"> -->

    <nav class="ml-auto flex items-center gap-4" aria-label="Global">
      <div class="flex gap-1">
        <button (click)="onCreateCarpeta()"
          class="hover:bg-gray-200 inline-flex items-center rounded-md py-2 px-3 text-sm font-medium cursor-pointer text-gray-700">
          <i class="fa-solid fa-folder-plus mr-1" style="color: #d68e1e;"></i>
        </button>

        <button (click)="onModificarCarpeta()"
          class="hover:bg-gray-200 inline-flex items-center rounded-md py-2 px-3 text-sm font-medium cursor-pointer text-gray-700">
          <i class="fa-solid fa-pen-to-square mr-1" style="color: #d68e1e;"></i>
        </button>

        <button (click)="onCrearReporte()"
          class="hover:bg-gray-200 inline-flex items-center rounded-md py-2 px-3 text-sm font-medium cursor-pointer text-gray-700">
          <i class="fa-solid fa-file-circle-plus mr-1" style="color: #d68e1e;"></i>
        </button>

        <button (click)="onModificarReporte()"
          class="hover:bg-gray-200 inline-flex items-center rounded-md py-2 px-3 cursor-pointer text-sm font-medium text-gray-700">
          <i class="fa-solid fa-file-lines mr-1" style="color: #d68e1e;"></i>
        </button>
      </div>
    </nav>
  </div>
</header>
