<div [ngClass]="{
    'fixed inset-y-0 right-0 z-50 flex w-64 flex-col border-l bg-white transition-transform duration-300 ease-in-out md:relative md:translate-x-0': true,
    'translate-x-0': open,
    'translate-x-full': !open
  }">
  <div class="flex-1 overflow-auto py-2">
    <nav class="grid gap-1 px-2">
      @for (item of menuItems; track item.id) {
      <div>
        @if (!item.children) {
        <a [routerLink]="item.href!" routerLinkActive="bg-gray-200 text-[#cd870a]"
          class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium hover:bg-gray-100 text-gray-700">
          {{ item.label }}
        </a>
        } @else {
        <button (click)="toggleExpand(item.id)"
          class="flex w-full items-center justify-between rounded-md px-3 py-2 text-sm font-medium hover:bg-gray-100 text-gray-700"
          [ngClass]="{'bg-gray-200': expandedItems().includes(item.id)}">
          <div class="flex items-center gap-3">
            {{ item.label }}
          </div>
          <i class="fa-solid" [ngClass]="{
                'fa-chevron-down': expandedItems().includes(item.id),
                'fa-chevron-right': !expandedItems().includes(item.id)
              }"></i>
        </button>
        @if (expandedItems().includes(item.id)) {
        <div class="ml-4 mt-1 grid gap-1 pl-4 border-l border-gray-300">
          @for (child of item.children; track child.id) {
          <a [routerLink]="child.href!" routerLinkActive="bg-gray-200 text-[#cd870a]"
            class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium hover:bg-gray-100 text-gray-700">
            {{ child.label }}
          </a>
          }
        </div>
        }
        }
      </div>
      }
    </nav>
  </div>
</div>
