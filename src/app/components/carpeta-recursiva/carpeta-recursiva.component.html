<a class="flex gap-1 items-center cursor-pointer ">
  <i class="fa-solid fa-folder-open" style="color: #d68e1e;"></i>
  <span class="px-2 rounded cursor-pointer transition-colors duration-200 active:bg-blue-600">
    {{carpeta().nombre}}
  </span>
</a>
<div class="ml-4">

  @for (hija of carpeta().carpetas_hija; track hija) {
  <a>
    <app-carpeta-recursiva [carpeta]="hija"></app-carpeta-recursiva>
  </a>
  }

  @for (reporte of carpeta().reportes; track reporte.id) {
  <a>
    <div class="flex gap-0.5 items-center">
      <i class="fa-solid fa-file" style="color: #f08e1e;"></i>
      <span>{{reporte.titulo_reporte}}</span>
    </div>
  </a>
  }

</div>
