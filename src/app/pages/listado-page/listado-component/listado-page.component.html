<app-header [id_item]="hoveredItem()" />

<div class="flex justify-between items-center min-h-screen bg-gray-200">
  <section class="flex-1  rounded-lg mx-4 ">
    <app-directorio [directorio]="directorio()" (item)="mandarItem($event)" />
  </section>


  <section class="flex-1 p-4 rounded-lg mx-4">
    @if (selectedItem() !== null) {
    <app-details-page [item]="selectedItem()" />
    }


  </section>

  <aside class="flex-1  p-4 rounded-lg mx-4">
    <app-side-menu />
  </aside>


</div>
