<div class="p-6 w-4xl">
  <header class="flex justify-between">
    <p class="text-xl">Crear Reporte</p>
    <a routerLink="/Listado" routerLinkActive="active">
      <i class="fa-solid fa-list" style="color: #f0841e;"></i>
    </a>
  </header>

  <form autocomplete="off" class="mt-2">

    <!-- Campo de nombre -->
    <div class="mb-3 flex flex-col">
      <label class="sm:w-3/12 px-2 text-2xl">Título:*</label>

      <div class="sm:w-9/12 px-2 flex flex-col">

        <input type="text" class="w-lg text-lg border-2 border-amber-600 rounded-md">


        <span class="text-red-500">
          Debe de ser de 3 letras

        </span>


      </div>

      <label class="sm:w-3/12 px-2 text-2xl">Selección de las columnas:*</label>

      <input type="checkbox">

      <app-filter />
    </div>



    <div class="flex ">
      <div class="flex gap-2">
        <button type="submit"
          class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-base font-medium rounded-md shadow-sm bg-amber-500 hover:bg-amber-700 text-white float-right">
          Aceptar
        </button>
        <button type="submit"
          class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-base font-medium rounded-md shadow-sm bg-amber-500 hover:bg-amber-700 text-white float-right">
          Cancelar
        </button>
      </div>
    </div>


  </form>
</div>
