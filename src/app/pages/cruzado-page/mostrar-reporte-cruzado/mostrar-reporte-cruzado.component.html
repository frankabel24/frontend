<div class="flex flex-col  justify-around mx-auto w-full max-w-[550px]  p-6 ">
  <header class="flex justify-between">
    <span>{{reporte().titulo_reporte}}</span>
    <div class="flex gap-4 items-center">
      <button class="rounded-sm bg-red-400 hover:bg-red-600 p-2 cursor-pointer" (click)="exportarAPDF()">
        .pdf
      </button>
      <button class="rounded-sm bg-lime-400 hover:bg-lime-600 p-2 cursor-pointer" (click)="exportarAXLS()">
        .xls
      </button>
      <a class=" cursor-pointer" (click)="onCancel()">
        <i class="fa-solid fa-list" style="color: #f0841e;"></i>
      </a>
    </div>
  </header>

  <div class="flex flex-col">
    <div class="overflow-x-auto sm:mx-0.5 lg:mx-0.5">
      <div class="py-2 inline-block min-w-full sm:px-6 lg:px-8">
        <div class="overflow-hidden">
          <table id="tabla-reporte" class="min-w-full">
            <thead class=" border-b">
              <tr>

                <th scope="col" class="text-sm font-medium  px-6 py-4 text-left">
                  Facultad
                </th>
                @for (item of Generos; track $index) {
                <th scope="col" class="text-sm font-medium  px-6 py-4 text-left">
                  {{item}}
                </th>
                }

              </tr>
            </thead>
            <tbody>
              @for (item of Facultades; track $index) {
              <tr class=" border-b">
                <td class="px-6 py-4 whitespace-nowrap text-sm  ">{{ item }}</td>
                <td class="text-sm  font-light px-6 py-4 whitespace-nowrap">
                  200
                </td>
                <td class="text-sm  font-light px-6 py-4 whitespace-nowrap">
                  500
                </td>

              </tr>
              }

            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
